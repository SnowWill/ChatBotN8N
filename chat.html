<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot N8N</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
              500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a'
            }
          },
          boxShadow: {
            soft: '0 10px 30px rgba(2, 6, 23, .15)'
          }
        }
      }
    }
  </script>
  <style>
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,0.7); }
    .dark .glass { background: rgba(2,6,23,.5); }
    .chat::-webkit-scrollbar { width: 10px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(148,163,184,.5); border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-200 dark:from-slate-900 dark:to-slate-950 transition-colors">
<div id="app" class="p-4 sm:p-6 md:p-10">
  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="glass rounded-3xl shadow-soft border border-slate-200/70 dark:border-slate-800/60 p-4 sm:p-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl bg-primary-600 flex items-center justify-center text-white font-bold">V</div>
        <div>
          <h1 class="text-xl font-semibold text-slate-800 dark:text-slate-100">Chatbot N8N</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">ล็อกอินด้วย PIN เรียบร้อย</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button @click="resetChat"
                class="px-3 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:opacity-90 text-sm">
          เริ่มใหม่
        </button>
        <button @click="logout"
                class="px-3 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 text-sm">
          ออกจากระบบ
        </button>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="glass rounded-3xl shadow-soft border border-slate-200/70 dark:border-slate-800/60 mt-4 p-0 overflow-hidden">
      <!-- Messages -->
      <div ref="chat" class="chat h-[60vh] overflow-y-auto p-4 sm:p-6 space-y-4 bg-gradient-to-b from-transparent to-white/60 dark:to-slate-900/50">
        <template v-for="(m, i) in messages" :key="i">
          <div class="flex items-start gap-3" :class="m.role==='user' ? 'justify-end' : ''">
            <!-- Avatar -->
            <div v-if="m.role==='assistant'" class="shrink-0 h-8 w-8 rounded-2xl bg-primary-600 text-white flex items-center justify-center font-semibold">V</div>
            <div v-else class="shrink-0 h-8 w-8 rounded-2xl bg-slate-400 text-white flex items-center justify-center font-semibold order-2">U</div>

            <!-- Bubble -->
            <div :class="[
                'max-w-[85%] rounded-2xl px-4 py-3 shadow-sm',
                m.role==='assistant'
                  ? 'bg-white/90 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/60 text-slate-800 dark:text-slate-100'
                  : 'bg-primary-600 text-white'
              ]">
              <div class="whitespace-pre-wrap leading-relaxed">{{ m.content }}</div>
              <div class="mt-1 text-xs opacity-60" v-if="m.timestamp">{{ m.timestamp }}</div>
            </div>
          </div>
        </template>

        <!-- Typing indicator -->
        <div v-if="typing" class="flex items-center gap-3">
          <div class="shrink-0 h-8 w-8 rounded-2xl bg-primary-600 text-white flex items-center justify-center font-semibold">V</div>
          <div class="bg-white/90 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/60 text-slate-800 dark:text-slate-100 rounded-2xl px-4 py-3 shadow-sm">
            <span class="inline-flex items-center gap-2">
              <span class="text-sm">กำลังพิมพ์</span>
              <span class="inline-flex">
                <span class="w-1.5 h-1.5 rounded-full bg-current animate-bounce [animation-delay:-.2s]"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-current animate-bounce mx-1"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-current animate-bounce [animation-delay:.2s]"></span>
              </span>
            </span>
          </div>
        </div>
      </div>

      <!-- Quick actions -->
      <div class="px-4 sm:px-6 pt-3 flex flex-wrap gap-2 border-t border-slate-200/70 dark:border-slate-800/60 bg-white/70 dark:bg-slate-900/40">
        <button v-for="s in suggestions" :key="s" @click="useSuggestion(s)"
                class="text-sm px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700 hover:bg-slate-100/70 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-200">
          {{ s }}
        </button>
      </div>

      <!-- Composer -->
      <form @submit.prevent="send" class="p-4 sm:p-6 flex items-end gap-3 bg-white/70 dark:bg-slate-900/40 border-t border-slate-200/70 dark:border-slate-800/60">
        <div class="flex-1">
          <label class="sr-only" for="msg">พิมพ์ข้อความ</label>
          <textarea
            id="msg"
            v-model="draft"
            rows="1"
            @keydown.enter.exact.prevent="send"
            placeholder="ถามอะไรก็ได้… (กด Enter เพื่อส่ง เว้นบรรทัด)"
            class="w-full resize-none rounded-2xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-800/70 p-3 focus:outline-none focus:ring-2 focus:ring-primary-400 dark:focus:ring-primary-600 text-slate-800 dark:text-slate-100 placeholder-slate-400"></textarea>
        </div>
        <button type="submit" :disabled="!canSend"
                class="rounded-2xl px-4 py-3 bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-soft">
          ส่ง
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="text-center text-xs text-slate-500 dark:text-slate-400 mt-4">
      Chatbot N8N • Demo | <a href="login.html" class="underline">กลับหน้า Login</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3"></script>
<script>
const BOT_NAME = 'Vee';

const canned = [
  {k: /hello|hi|สวัสดี/i, a: () => `สวัสดี! ฉันคือ ${BOT_NAME} ช่วยอะไรได้บ้าง?`},
  {k: /help|ช่วย/i, a: () => 'ลองพิมพ์: "เวลา", "สวัสดี","วัน"'},
  {k: /เวลา|time/i, a: () => 'ตอนนี้เวลา ' + new Date().toLocaleTimeString('th-TH')},
  {k: /วัน|date|วันที่/i, a: () => 'วันนี้คือ ' + new Date().toLocaleDateString('th-TH', {dateStyle: 'full'})},
];

const app = Vue.createApp({
  data() {
    return {
      theme: (localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')),
      draft: '',
      typing: false,
      messages: [
        { role: 'assistant', content: 'ฉันคือ Chatbot N8N – ผู้ช่วย Ai สามารถถามได้เลย', timestamp: new Date().toLocaleTimeString('th-TH') },
      ],
    }
  },
  computed: {
    canSend(){ return this.draft.trim().length > 0 && !this.typing },
  },
  mounted(){
    // ถ้าไม่เคย login ให้เด้งกลับไปหน้า login
    if(localStorage.getItem('loggedIn') !== 'yes'){
      window.location.href = 'login.html';
      return;
    }
    this.applyTheme();
    this.$nextTick(() => this.scrollBottom());
  },
  methods: {
    applyTheme(){
      document.documentElement.classList.toggle('dark', this.theme === 'dark');
      localStorage.setItem('theme', this.theme);
    },
    resetChat(){
      this.messages = [
        { role: 'assistant', content: 'เริ่มใหม่แล้ว! มีอะไรอยากถามบ้าง 😊', timestamp: new Date().toLocaleTimeString('th-TH') }
      ];
      this.draft='';
      this.$nextTick(this.scrollBottom);
    },
    logout(){
      localStorage.removeItem('loggedIn');
      this.draft = '';
      this.typing = false;
      window.location.href = 'login.html';
    },
    useSuggestion(s){ this.draft = s; this.$nextTick(() => this.send()); },
    push(role, content){
      this.messages.push({ role, content, timestamp: new Date().toLocaleTimeString('th-TH') });
      this.$nextTick(this.scrollBottom);
    },
    scrollBottom(){
      const el = this.$refs.chat; if(!el) return;
      el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    },
    send(){
      if(!this.canSend) return;
      const text = this.draft.trim();
      this.draft = '';
      this.push('user', text);
      this.reply(text);
    },

    async reply(text){
      this.typing = true;
      try {
        const answer = await this.callAPI(text);   // จุดนี้เอาไว้เรียก API จริง
        this.push('assistant', answer);
      } catch (err) {
        console.error('API error, fallback to local rules:', err);
        const found = canned.find(c => c.k.test(text));
        let answer = found ? found.a() : this.smartReply(text);
        answer += '\n\n(ตอนนี้ตอบจากโหมดเดโม่ เพราะยังไม่ได้ตั้งค่า API จริง)';
        this.push('assistant', answer);
      } finally {
        this.typing = false;
      }
    },

    async callAPI(userText){
      // ❗ ตรงนี้เอาไว้ใส่ URL API ของคุณ
      // เช่น const API_URL = "https://your-n8n-or-backend.com/api/chat";
      const API_URL = "<<< ใส่ API URL ตรงนี้ >>>";

      // ถ้ายังไม่ได้ตั้งค่า ให้โยน error กลับไปใช้โหมดเดโม่
      if (API_URL.includes("<<<")) {
        throw new Error("API URL ยังไม่ถูกตั้งค่า");
      }

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userText })
      });

      if (!res.ok) throw new Error("API ตอบกลับผิดพลาด: " + res.status);

      const data = await res.json();
      return data.reply || data.message || JSON.stringify(data);
    },

    smartReply(text){
      const t = text.toLowerCase();
      if(t.includes('ฟีเจอร์') || t.includes('feature')){
        return 'ฟีเจอร์เดโม: แชต UI สวยๆ, ปุ่มลัด, ตัวบอกกำลังพิมพ์, Login ด้วย PIN 6 หลัก, Logout, ระบบจำธีม\n(ถ้าเชื่อมต่อ API จริง เช่น OpenAI / n8n ผ่าน backend จะแชร์ความรู้ได้เยอะขึ้นอีกมาก)';
      }
      if(t.includes('เชื่อมต่อ') || t.includes('api')){
        return 'ตรงฟังก์ชัน callAPI() ในไฟล์ chat.html คือจุดที่คุณเอา URL API มาใส่ครับ เช่นจาก n8n หรือ Backend ของคุณเอง 🎯';
      }
      return 'โอเค รับทราบ: "' + text + '" \nตอนนี้เป็นโหมดเดโม่—ยังไม่ได้เชื่อม API จริง 😉';
    }
  }
});

app.mount('#app');
</script>
</body>
</html>
